<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Recommendation System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-header">
            <h1>🎯 Event Recommendation System</h1>
            <p>Discover events that match your interests</p>
        </div>

        <!-- LOGIN -->

        <div id="loginBox" class="auth-card">

            <h2>🔐 Login</h2>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p>
                Don't have an account?
                <button
                    class="link-button"
                    onclick="showSignup()">
                    Sign Up
                </button>
            </p>

        </div>


        <!-- SIGNUP -->

        <div id="signupBox" class="auth-card hidden">

            <h2>📝 Create Account</h2>

            <form id="signupForm">

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p id="signupMessage"></p>

            <p>
                Already have an account?

                <button
                    class="link-button"
                    onclick="showLogin()">
                    Login
                </button>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
